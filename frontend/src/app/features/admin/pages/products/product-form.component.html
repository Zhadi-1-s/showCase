<div class="px-4 py-6 lg:px-0 lg:py-0">
  <div class="mb-6 flex items-center gap-3">
    <a routerLink="/admin/products" class="btn-secondary py-2">
      <app-icon name="chevron-right" class="h-4 w-4 rotate-180" />
      Назад
    </a>
    <div>
      <h1 class="text-2xl font-bold text-slate-900">
        {{ isEdit() ? 'Редактирование товара' : 'Новый товар' }}
      </h1>
      <p class="text-sm text-slate-500">Заполните карточку и загрузите фото</p>
    </div>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-20">
      <span class="h-8 w-8 animate-spin rounded-full border-2 border-brand-600 border-t-transparent"></span>
    </div>
  } @else {
    @if (errorMessage()) {
      <p class="mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
    }

    <form class="grid gap-8 lg:grid-cols-5" [formGroup]="form" (ngSubmit)="submit()">
      <div class="space-y-4 lg:col-span-3">
        <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5">
          <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-500">Основное</h2>
          <div class="grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="mb-1 block text-sm font-medium text-slate-700" for="name">Название *</label>
              <input id="name" type="text" formControlName="name" class="input-field" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="category">Категория *</label>
              <select id="category" formControlName="category" class="input-field">
                <option value="" disabled>Выберите</option>
                @for (c of categories; track c) {
                  <option [value]="c">{{ c }}</option>
                }
              </select>
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="condition">Состояние *</label>
              <select id="condition" formControlName="condition" class="input-field">
                @for (c of conditions; track c) {
                  <option [value]="c">{{ c }}</option>
                }
              </select>
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="brand">Бренд</label>
              <input id="brand" type="text" formControlName="brand" class="input-field" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="model">Модель</label>
              <input id="model" type="text" formControlName="model" class="input-field" />
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1 block text-sm font-medium text-slate-700" for="description">Описание</label>
              <textarea id="description" formControlName="description" rows="4" class="input-field resize-y"></textarea>
            </div>
          </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-slate-50 p-5">
          <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-500">Цена и размещение</h2>
          <div class="grid gap-4 sm:grid-cols-3">
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="price">Цена (₸) *</label>
              <input id="price" type="number" min="0" formControlName="price" class="input-field" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="branch">Филиал *</label>
              <select id="branch" formControlName="branch" class="input-field">
                <option value="" disabled>Выберите филиал</option>
                @for (b of branches(); track b._id) {
                  <option [value]="b._id">{{ b.name }}</option>
                }
              </select>
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700" for="status">Статус *</label>
              <select id="status" formControlName="status" class="input-field">
                @for (s of statuses; track s) {
                  <option [value]="s">{{ s }}</option>
                }
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-500">Фотографии</h2>

          <label class="drop-zone cursor-pointer" [class.opacity-60]="uploading()">
            <input
              type="file"
              class="hidden"
              accept="image/jpeg,image/png,image/webp,image/gif"
              multiple
              (change)="onFilesSelected($event)"
              [disabled]="uploading()"
            />
            @if (uploading()) {
              <span class="h-8 w-8 animate-spin rounded-full border-2 border-brand-600 border-t-transparent"></span>
              <p class="mt-3 text-sm text-slate-500">Загрузка в Cloudinary…</p>
            } @else {
              <app-icon name="package" class="h-10 w-10 text-brand-500" />
              <p class="mt-3 text-sm font-medium text-slate-700">Нажмите или перетащите фото</p>
              <p class="mt-1 text-xs text-slate-400">JPEG, PNG, WebP до 5 MB</p>
            }
          </label>

          @if (photos().length > 0) {
            <div class="mt-4 grid grid-cols-2 gap-3">
              @for (url of photos(); track url) {
                <div class="group relative overflow-hidden rounded-xl ring-1 ring-slate-200">
                  <img [src]="url" alt="" class="aspect-square w-full object-cover" />
                  <button
                    type="button"
                    class="absolute right-2 top-2 rounded-full bg-red-600 p-1.5 text-white opacity-90 shadow hover:bg-red-700"
                    (click)="removePhoto(url)"
                    title="Удалить"
                  >
                    <app-icon name="x" class="h-3.5 w-3.5" />
                  </button>
                </div>
              }
            </div>
          }
        </div>

        <div class="mt-6 flex flex-wrap gap-3">
          <button type="submit" class="btn-primary flex-1" [disabled]="saving() || uploading()">
            @if (saving()) {
              Сохранение…
            } @else {
              {{ isEdit() ? 'Сохранить' : 'Добавить товар' }}
            }
          </button>
          <a routerLink="/admin/products" class="btn-secondary">Отмена</a>
        </div>
      </div>
    </form>
  }
</div>
