<a
  [routerLink]="['/showcase/product', product._id]"
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:border-gold-200 hover:shadow-xl hover:shadow-gold-100/50"
>
  <div class="relative aspect-[4/3] overflow-hidden bg-slate-100">
    @if (imageUrl(); as img) {
      <img
        [src]="img"
        [alt]="product.name"
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        loading="lazy"
      />
    } @else {
      <div class="flex h-full items-center justify-center text-slate-300">
        <app-icon name="package" class="h-14 w-14" />
      </div>
    }
    <div class="absolute left-3 top-3">
      <app-status-badge [status]="product.status" />
    </div>
    <div
      class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-900/60 to-transparent p-4 pt-12 opacity-0 transition group-hover:opacity-100"
    >
      <span class="text-sm font-medium text-white">Подробнее →</span>
    </div>
  </div>

  <div class="flex flex-1 flex-col p-4">
    <p class="text-xs font-medium uppercase tracking-wide text-gold-600">{{ product.category }}</p>
    <h3 class="mt-1 line-clamp-2 font-semibold text-slate-900 group-hover:text-brand-700">
      {{ product.name }}
    </h3>
    @if (product.brand) {
      <p class="mt-0.5 text-xs text-slate-500">{{ product.brand }} {{ product.model }}</p>
    }
    <div class="mt-2">
      <app-condition-stars [condition]="product.condition" />
    </div>
    <p class="mt-auto pt-3 text-xl font-bold text-slate-900">
      {{ product.price | appCurrency }}
    </p>
  </div>
</a>
