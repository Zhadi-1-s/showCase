<header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 shadow-sm backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4">
    <a
      routerLink="/showcase"
      class="flex items-center gap-2 rounded-lg text-slate-900 transition hover:text-brand-700"
      (click)="closeMobile()"
    >
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow-md">
        <app-icon name="store" class="h-5 w-5" />
      </span>
      <span class="hidden font-bold tracking-tight sm:inline">Lombard</span>
    </a>

    <nav class="hidden items-center gap-1 md:flex">
      <a routerLink="/showcase" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="closeMobile()">
        <app-icon name="home" class="h-4 w-4" />
        Главная
      </a>
      <a routerLink="/showcase/catalog" routerLinkActive="nav-link-active" class="nav-link" (click)="closeMobile()">
        <app-icon name="grid" class="h-4 w-4" />
        Каталог
      </a>
      @if (auth.currentUser$ | async; as user) {
        <a routerLink="/admin" routerLinkActive="nav-link-active" class="nav-link" (click)="closeMobile()">
          <app-icon name="shield" class="h-4 w-4" />
          Админка
        </a>
        <div class="nav-user">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-100 text-brand-700">
            <app-icon name="user" class="h-4 w-4" />
          </span>
          <span class="max-w-[140px] truncate text-sm font-medium text-slate-700">
            {{ user.name || user.email }}
          </span>
        </div>
        <button type="button" class="nav-link text-red-600 hover:bg-red-50 hover:text-red-700" (click)="logout()">
          <app-icon name="logout" class="h-4 w-4" />
          Выход
        </button>
      }
    </nav>

    <button
      type="button"
      class="inline-flex items-center justify-center rounded-lg p-2 text-slate-600 hover:bg-slate-100 md:hidden"
      (click)="toggleMobile()"
      [attr.aria-expanded]="mobileOpen()"
      aria-label="Меню"
    >
      @if (mobileOpen()) {
        <app-icon name="x" class="h-6 w-6" />
      } @else {
        <app-icon name="menu" class="h-6 w-6" />
      }
    </button>
  </div>

  @if (mobileOpen()) {
    <nav class="border-t border-slate-100 bg-white px-4 py-3 md:hidden">
      <a routerLink="/showcase" routerLinkActive="nav-link-active" class="nav-link-mobile" (click)="closeMobile()">
        <app-icon name="home" class="h-5 w-5" />
        Главная
      </a>
      <a routerLink="/showcase/catalog" routerLinkActive="nav-link-active" class="nav-link-mobile" (click)="closeMobile()">
        <app-icon name="grid" class="h-5 w-5" />
        Каталог
      </a>
      @if (auth.currentUser$ | async; as user) {
        <a routerLink="/admin" routerLinkActive="nav-link-active" class="nav-link-mobile" (click)="closeMobile()">
          <app-icon name="shield" class="h-5 w-5" />
          Админка
        </a>
        <p class="px-3 py-2 text-xs text-slate-500">{{ user.name || user.email }}</p>
        <button type="button" class="nav-link-mobile w-full text-red-600" (click)="logout()">
          <app-icon name="logout" class="h-5 w-5" />
          Выход
        </button>
      }
    </nav>
  }
</header>
